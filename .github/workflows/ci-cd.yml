name: Advanced CI/CD to Kubernetes
on:
  push:
    branches: ["main"]
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/advanced-demo-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/advanced-demo-frontend
jobs:
  check-secrets:
    name: Check deploy secret
    runs-on: ubuntu-latest
    outputs:
      has-kubeconfig: ${{ steps.check.outputs.has-kubeconfig }}
    steps:
      - id: check
        env:
          KC: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KC" ]; then
            echo "has-kubeconfig=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-kubeconfig=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Test, Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test backend
        working-directory: backend
        run: |
          npm install
          npm test
      - name: Lowercase image namespace
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${{ steps.ns.outputs.owner }}/advanced-demo-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${{ steps.ns.outputs.owner }}/advanced-demo-frontend" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build backend image
        run: docker build -t $BACKEND_IMAGE:${{ github.sha }} -t $BACKEND_IMAGE:latest ./backend
      - name: Build frontend image
        run: docker build -t $FRONTEND_IMAGE:${{ github.sha }} -t $FRONTEND_IMAGE:latest ./frontend
      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $BACKEND_IMAGE:latest
      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push, check-secrets]
    if: needs.check-secrets.outputs.has-kubeconfig == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lowercase image namespace
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Replace local image names with registry images
        run: |
          OWNER="${{ steps.ns.outputs.owner }}"
          SHA="${{ github.sha }}"
          sed -i "s|sre-backend:v1|ghcr.io/${OWNER}/advanced-demo-backend:${SHA}|g" k8s/backend-deployment.yaml
          sed -i "s|sre-frontend:v1|ghcr.io/${OWNER}/advanced-demo-frontend:${SHA}|g" k8s/frontend-deployment.yaml
          sed -i "s|imagePullPolicy: Never|imagePullPolicy: IfNotPresent|g" k8s/backend-deployment.yaml
          sed -i "s|imagePullPolicy: Never|imagePullPolicy: IfNotPresent|g" k8s/frontend-deployment.yaml
      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
